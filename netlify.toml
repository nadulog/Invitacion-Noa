[build]
  command = "node scripts/build-netlify.mjs"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "22"
  # This invitation is exported as a static bundle by build-netlify.mjs.
  # Netlify otherwise detects the unused Next dependency and injects its runtime.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
